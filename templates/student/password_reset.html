{% extends 'student/studentbase.html' %}
{% block content %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

.reset-card{
max-width:520px;
margin:auto;
border-radius:18px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.reset-header{
background:linear-gradient(135deg,#ff512f,#dd2476);
color:white;
padding:25px;
text-align:center;
}

.reset-body{
padding:30px;
}

.form-control{
border-radius:10px;
padding:12px;
}

.btn-reset{
border-radius:10px;
padding:12px;
font-weight:600;
}

.info-text{
font-size:14px;
color:#777;
margin-bottom:20px;
}

</style>

<div class="container mt-5">

<div class="reset-card">

<!-- Header -->

<div class="reset-header">
<h4><i class="fas fa-envelope"></i> Forgot Password</h4>
<p class="mb-0">Enter your email to receive a password reset link</p>
</div>

<!-- Body -->

<div class="reset-body">

<p class="info-text">
We will send a password reset link to your registered email.
</p>

<form method="POST">

{% csrf_token %}

<label class="form-label">
<i class="fas fa-at"></i> Email Address
</label>

{{ form.email }}

<br>

<button type="submit" class="btn btn-danger w-100 btn-reset">
<i class="fas fa-paper-plane"></i> Send Reset Link
</button>

</form>

</div>

</div>

</div>

{% endblock %}
