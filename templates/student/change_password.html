{% extends 'student/studentbase.html' %}
{% block content %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

:root{
    --glass-bg: rgba(15, 23, 42, 0.5);
    --glass-border: rgba(255,255,255,0.08);
    --primary: #6366f1;
    --accent: #10b981;
}

.masterbox{
    animation: fadeIn 0.8s ease;
}
@keyframes fadeIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
}

.password-card{
    max-width:520px;
    margin:auto;
    border-radius:25px;
    overflow:hidden;
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    border:1px solid var(--glass-border);
    box-shadow:0 20px 50px rgba(0,0,0,0.4);
    transition:0.3s;
}

.password-card:hover{
    transform: translateY(-5px);
}

/* HEADER */
.password-header{
    background: linear-gradient(135deg,#6366f1,#8b5cf6);
    color:white;
    padding:30px;
    text-align:center;
}

.password-header i{
    font-size:28px;
    margin-bottom:10px;
}

/* BODY */
.password-body{
    padding:30px;
}

/* INPUT */
.form-control{
    border-radius:12px;
    padding:12px;
    background: rgba(255,255,255,0.05);
    border:1px solid var(--glass-border);
    color:white;
}

.form-control:focus{
    border-color: var(--primary);
    box-shadow:0 0 10px rgba(99,102,241,0.5);
    background: rgba(255,255,255,0.08);
    color:white;
}

/* LABEL */
.form-label{
    color:#cbd5f5;
    font-weight:500;
}

/* BUTTON */
.btn-update{
    border-radius:12px;
    padding:14px;
    font-weight:600;
    background: linear-gradient(135deg,#6366f1,#4f46e5);
    border:none;
    transition:0.3s;
}

.btn-update:hover{
    transform: scale(1.02);
    box-shadow:0 10px 25px rgba(99,102,241,0.4);
}

/* ICON INPUT STYLE */
.input-group-text{
    background: rgba(255,255,255,0.05);
    border:1px solid var(--glass-border);
    color:#cbd5f5;
    border-radius:12px 0 0 12px;
}

</style>


<div class="masterbox">

<div class="container mt-5">

<div class="password-card">

<!-- 🔥 HEADER -->
<div class="password-header">
    <i class="fas fa-shield-alt"></i>
    <h4>Change Password</h4>
    <p class="mb-0">Secure your account with a strong password</p>
</div>

<!-- 💎 BODY -->
<div class="password-body">

<form method="POST">
{% csrf_token %}

<!-- OLD PASSWORD -->
<div class="mb-3">
<label class="form-label"><i class="fas fa-key"></i> Old Password</label>
<div class="input-group">
    <span class="input-group-text"><i class="fas fa-lock"></i></span>
    {{ form.old_password }}
</div>
</div>

<!-- NEW PASSWORD -->
<div class="mb-3">
<label class="form-label"><i class="fas fa-lock"></i> New Password</label>
<div class="input-group">
    <span class="input-group-text"><i class="fas fa-star"></i></span>
    {{ form.new_password1 }}
</div>
</div>

<!-- CONFIRM PASSWORD -->
<div class="mb-4">
<label class="form-label"><i class="fas fa-check-circle"></i> Confirm Password</label>
<div class="input-group">
    <span class="input-group-text"><i class="fas fa-check"></i></span>
    {{ form.new_password2 }}
</div>
</div>

<!-- BUTTON -->
<button type="submit" class="btn btn-update w-100">
    <i class="fas fa-save"></i> Update Password
</button>

</form>

</div>

</div>

</div>

</div>

{% endblock %}
