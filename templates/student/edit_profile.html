{% extends 'student/studentbase.html' %}
{% load static %}
{% block content %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>

.profile-card{
    max-width:600px;
    margin:auto;
    border-radius:20px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    box-shadow:0 8px 25px rgba(0,0,0,0.3);
    padding:30px;
    color:white;
}

.profile-img{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #6366f1;
    transition:0.3s;
}

.profile-img:hover{
    transform: scale(1.05);
}

.drop-area{
    border:2px dashed #6366f1;
    padding:15px;
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;
}

.drop-area:hover{
    background:#1e293b;
}

</style>

<div class="container mt-5">

<div class="profile-card">

<h4 class="text-center mb-4">Edit Profile</h4>

<!-- ✅ SUCCESS POPUP -->
{% if messages %}
<script>
{% for message in messages %}
Swal.fire({
    icon: 'success',
    title: 'Success',
    text: '{{ message }}',
    confirmButtonColor: '#6366f1'
});
{% endfor %}
</script>
{% endif %}

<form method="POST" enctype="multipart/form-data">
{% csrf_token %}

<!-- ✅ PROFILE IMAGE -->
<div class="text-center mb-4">

    {% if student.profile_pic %}
        <img id="preview" src="{{ student.profile_pic.url }}" class="profile-img">
    {% else %}
        <img id="preview" src="{% static 'profile_pic/Student/default.png' %}" class="profile-img">
    {% endif %}

    <br><br>

    <!-- DRAG DROP -->
    <div id="drop-area" class="drop-area">
        <p>Drag & Drop Image or Click</p>
        <input type="file" name="profile_pic" id="fileElem" hidden>
    </div>

</div>

<!-- MOBILE -->
<div class="mb-3">
<label class="form-label">Mobile</label>
<input type="text" name="mobile" class="form-control" value="{{ student.mobile }}">
</div>

<!-- ADDRESS -->
<div class="mb-3">
<label class="form-label">Address</label>
<input type="text" name="address" class="form-control" value="{{ student.address }}">
</div>

<!-- COURSE -->
<div class="mb-3">
<label class="form-label">Course</label>
<select name="course" class="form-control">

{% for c in courses %}
<option value="{{ c.id }}"
{% if student.course.id == c.id %} selected {% endif %}>
{{ c.course_name }}
</option>
{% endfor %}

</select>
</div>

<!-- SUBMIT -->
<button type="submit" class="btn btn-primary w-100">
Update Profile
</button>

</form>

<!-- 🔒 CHANGE PASSWORD -->
<hr class="my-4">

<h5 class="text-center mb-3">Change Password</h5>

<form method="POST" action="{% url 'student:change-password' %}">
{% csrf_token %}

<div class="mb-3">
    <input type="password" name="old_password" class="form-control" placeholder="Old Password">
</div>

<div class="mb-3">
    <input type="password" name="new_password" class="form-control" placeholder="New Password">
</div>

<div class="mb-3">
    <input type="password" name="confirm_password" class="form-control" placeholder="Confirm Password">
</div>

<button type="submit" class="btn btn-warning w-100">
Change Password
</button>

</form>

</div>
</div>

<!-- ✅ JS -->
<script>

// CLICK OPEN FILE
let dropArea = document.getElementById("drop-area");
let fileInput = document.getElementById("fileElem");

dropArea.addEventListener("click", () => fileInput.click());

// DRAG EVENTS
dropArea.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropArea.style.background = "#1e293b";
});

dropArea.addEventListener("dragleave", () => {
    dropArea.style.background = "transparent";
});

dropArea.addEventListener("drop", (e) => {
    e.preventDefault();
    fileInput.files = e.dataTransfer.files;
    previewImage({ target: fileInput });
});

// PREVIEW IMAGE
function previewImage(event) {
    const image = document.getElementById('preview');
    image.src = URL.createObjectURL(event.target.files[0]);
}

fileInput.addEventListener("change", previewImage);

</script>

{% endblock %}
