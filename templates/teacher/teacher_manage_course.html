{% extends 'teacher/teacherbase.html' %}
{% block content %}

<style>
.container {
    margin-top: 60px;
}

/* CARD */
.course-card {
    background: rgba(15,23,42,0.7);
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

/* TITLE */
.title {
    text-align: center;
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 20px;
    color: #6366f1;
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
    color: #e2e8f0;
}

th {
    background: rgba(255,255,255,0.05);
    padding: 12px;
    text-transform: uppercase;
    font-size: 12px;
    letter-spacing: 1px;
}

td {
    padding: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
}

tr:hover {
    background: rgba(255,255,255,0.03);
}

/* BUTTONS */
.btn-edit {
    background: #f59e0b;
    color: white;
    padding: 6px 12px;
    border-radius: 8px;
    text-decoration: none;
    margin-right: 5px;
}

.btn-delete {
    background: #ef4444;
    color: white;
    padding: 6px 12px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
}

/* EMPTY */
.empty {
    text-align: center;
    color: #ef4444;
    padding: 20px;
}
</style>

<div class="container">
    <div class="course-card">

        <div class="title">📚 My Courses</div>

        <table>
            <thead>
                <tr>
                    <th>Course Name</th>
                    <th>Course Code</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                {% if courses %}
                    {% for c in courses %}
                    <tr>
                        <td>{{ c.course_name }}</td>
                        <td>{{ c.exam_code }}</td>

                        <td>
                            <a href="{% url 'teacher:edit-course' c.id %}" class="btn-edit">
                                ✏ Edit
                            </a>

                            <!-- DELETE BUTTON WITH POPUP -->
                            <button class="btn-delete" onclick="confirmDelete({{ c.id }})">
                                🗑 Delete
                            </button>
                        </td>
                    </tr>
                    {% endfor %}
                {% else %}
                    <tr>
                        <td colspan="3" class="empty">
                            ❌ No courses created yet
                        </td>
                    </tr>
                {% endif %}
            </tbody>
        </table>

    </div>
</div>

<!-- DELETE SCRIPT -->
<script>
function confirmDelete(courseId) {
    let confirmAction = confirm("⚠️ Are you sure you want to delete this course?");

    if (confirmAction) {
        window.location.href = "/teacher/delete-course/" + courseId + "/";
    }
}
</script>

{% endblock %}
