{% extends 'teacher/teacherbase.html' %}
{% block content %}
{% load static %}

<style>
    .container-box {
        max-width: 1000px;
        margin: 60px auto;
        padding: 2rem;
        background: rgba(15, 23, 42, 0.85);
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        backdrop-filter: blur(15px);
        color: #e2e8f0;
        animation: fadeIn 0.6s ease-in-out;
    }

    .title {
        text-align: center;
        font-size: 1.8rem;
        font-weight: 700;
        margin-bottom: 1.5rem;
        color: #fff;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th {
        text-align: left;
        padding: 12px;
        font-size: 0.8rem;
        text-transform: uppercase;
        color: #94a3b8;
        border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    td {
        padding: 14px 12px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    tr:hover {
        background: rgba(255,255,255,0.03);
    }

    .question-text {
        color: #fff;
        font-weight: 500;
    }

    .marks {
        font-weight: 700;
        color: #38bdf8;
    }

    .actions a {
        margin-right: 8px;
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 0.8rem;
        text-decoration: none;
        display: inline-block;
        transition: 0.3s;
    }

    .view-btn {
        background: rgba(34,197,94,0.2);
        color: #22c55e;
    }

    .edit-btn {
        background: rgba(250,204,21,0.2);
        color: #facc15;
    }

    .delete-btn {
        background: rgba(239,68,68,0.2);
        color: #ef4444;
    }

    .actions a:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(0,0,0,0.3);
    }

    @keyframes fadeIn {
        from {opacity:0; transform:translateY(10px);}
        to {opacity:1; transform:translateY(0);}
    }
</style>

<div class="container-box">
    <div class="title">📘 Available Questions</div>

    <table>
        <thead>
            <tr>
                <th>Question</th>
                <th>Marks</th>
                <th style="text-align:right;">Actions</th>
            </tr>
        </thead>

        <tbody>
            {% for q in questions %}
            <tr>
                <td class="question-text">{{ q.question }}</td>

                <td class="marks">{{ q.marks }}</td>

                <td class="actions" style="text-align:right;">
                    <a href="{% url 'teacher:view-question-detail' q.id %}" class="view-btn">👁️</a>

                    <a href="{% url 'teacher:edit-question' q.id %}" class="edit-btn">✏️</a>

                    <a href="{% url 'teacher:remove-question' q.id %}"
                       class="delete-btn"
                       onclick="return confirm('Are you sure you want to delete this question?');">
                       🗑️
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock content %}
