{% extends 'exam/adminbase.html' %}
{% load static %}
{% block content %}

<div style="margin-bottom: 3.5rem;">
    <h1 style="font-family: 'Outfit'; font-size: 3rem; font-weight: 800;">
        Candidate Directory
    </h1>
    <p style="color: #64748b;">
        Comprehensive oversight of registered candidates.
    </p>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem;">

    <!-- Total Registered -->
    <a href="{% url 'admin-view-student' %}"
       style="text-decoration: none; background: rgba(15, 23, 42, 0.6); padding: 2.5rem; border-radius: 24px;">
       
        <div>
            <ion-icon name="person-outline" style="font-size: 1.8rem;"></ion-icon>
        </div>

        <div style="font-size: 2.5rem; color: white;">
            {{ total_student }}
        </div>

        <div style="color: #64748b;">Total Candidates</div>
    </a>

    <!-- Performance Archives -->
    <a href="{% url 'admin-view-student' %}"
       style="text-decoration: none; background: rgba(15, 23, 42, 0.6); padding: 2.5rem; border-radius: 24px;">
       
        <div>
            <ion-icon name="analytics-outline" style="font-size: 1.8rem;"></ion-icon>
        </div>

        <div style="font-size: 1.5rem; color: white;">
            Performance Archives
        </div>

        <div style="color: #64748b;">Review Credentials</div>
    </a>

</div>

{% endblock content %}
